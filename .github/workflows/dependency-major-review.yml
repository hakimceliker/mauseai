name: Monthly major dependency review

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Identify available major updates
        shell: bash
        run: |
          npm outdated --json > outdated.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const outdated = JSON.parse(fs.readFileSync('outdated.json', 'utf8') || '{}');
          const major = Object.entries(outdated).filter(([, item]) => {
            const current = Number.parseInt(String(item.current).replace(/^[^0-9]*/, '').split('.')[0], 10);
            const latest = Number.parseInt(String(item.latest).replace(/^[^0-9]*/, '').split('.')[0], 10);
            return Number.isFinite(current) && Number.isFinite(latest) && latest > current;
          });
          const rows = major.length
            ? major.map(([name, item]) => `| \`${name}\` | \`${item.current}\` | \`${item.latest}\` |`).join('\n')
            : '| — | No available major updates detected | — |';
          const report = [
            '# Monthly major dependency review',
            '',
            `- Commit: \`${process.env.GITHUB_SHA}\``,
            `- Date: ${new Date().toISOString()}`,
            '- Review required before adopting major updates; this report does not update dependencies.',
            '',
            '| Package | Current | Latest |',
            '|---|---:|---:|',
            rows,
            '',
          ].join('\n');
          fs.writeFileSync('major-dependency-review.md', report);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report);
          NODE
      - name: Upload review report
        uses: actions/upload-artifact@v4
        with:
          name: major-dependency-review-${{ github.run_id }}
          path: major-dependency-review.md
          if-no-files-found: error
