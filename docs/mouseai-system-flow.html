<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>MouseAI Sistem Akışı</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    body { margin: 0; background: #f7fafc; color: #102a43; }
    main { padding: 28px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #52606d; }
    svg { width: 100%; min-width: 980px; height: 660px; background: white; border: 1px solid #d9e2ec; border-radius: 18px; box-shadow: 0 12px 32px rgb(16 42 67 / 8%); }
    .node { fill: #ffffff; stroke: #9fb3c8; stroke-width: 2; }
    .core { fill: #eef7ff; stroke: #1677ff; }
    .store { fill: #ecfdf3; stroke: #159570; }
    .external { fill: #fff8eb; stroke: #d97706; }
    .label { font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .sub { font-size: 12px; font-weight: 400; fill: #52606d; }
    .arrow { stroke: #52606d; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .dashed { stroke-dasharray: 7 6; }
    .legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px; color: #52606d; font-size: 13px; }
    .dot { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; border: 1px solid #9fb3c8; }
  </style>
</head>
<body>
  <main>
    <h1>MouseAI ortak sistem akışı</h1>
    <p>Beyaz/şeffaf kullanıcı arayüzünden güvenli tenant, durable workflow, audit ve insan onayına uzanan uçtan uca akış.</p>
    <svg viewBox="0 0 1180 660" role="img" aria-label="MouseAI sistem akış diyagramı">
      <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52606d"/></marker></defs>
      <path class="arrow" d="M150 100 H250"/><path class="arrow" d="M350 100 H460"/><path class="arrow" d="M560 100 H680"/>
      <path class="arrow" d="M730 150 V250"/><path class="arrow" d="M810 300 H950"/><path class="arrow" d="M810 350 H950"/><path class="arrow" d="M810 400 H950"/>
      <path class="arrow" d="M730 450 V545 H580"/><path class="arrow" d="M730 450 V545 H770"/><path class="arrow" d="M730 450 V545 H960"/>
      <path class="arrow dashed" d="M1030 100 V250 H790"/><path class="arrow dashed" d="M300 170 V545 H500"/>
      <rect class="node" x="40" y="70" width="110" height="60" rx="14"/><text class="label" x="95" y="100">Kullanıcı</text>
      <rect class="core" x="250" y="70" width="110" height="60" rx="14"/><text class="label" x="305" y="92">Next.js</text><text class="label sub" x="305" y="112">UI</text>
      <rect class="core" x="460" y="70" width="110" height="60" rx="14"/><text class="label" x="515" y="92">Task API</text><text class="label sub" x="515" y="112">Conversation</text>
      <rect class="core" x="680" y="70" width="110" height="60" rx="14"/><text class="label" x="735" y="92">Inngest</text><text class="label sub" x="735" y="112">task.execute</text>
      <rect class="core" x="680" y="250" width="110" height="100" rx="14"/><text class="label" x="735" y="280">Durable</text><text class="label" x="735" y="302">Worker</text><text class="label sub" x="735" y="326">retry / policy</text>
      <rect class="external" x="950" y="270" width="150" height="52" rx="14"/><text class="label" x="1025" y="296">OpenAI</text>
      <rect class="external" x="950" y="335" width="150" height="52" rx="14"/><text class="label" x="1025" y="361">Anthropic</text>
      <rect class="external" x="950" y="400" width="150" height="52" rx="14"/><text class="label" x="1025" y="426">Human Approval</text>
      <rect class="store" x="470" y="515" width="130" height="62" rx="14"/><text class="label" x="535" y="540">Checkpoint</text><text class="label sub" x="535" y="560">resume</text>
      <rect class="store" x="675" y="515" width="130" height="62" rx="14"/><text class="label" x="740" y="540">Audit</text><text class="label sub" x="740" y="560">ledger</text>
      <rect class="store" x="880" y="515" width="130" height="62" rx="14"/><text class="label" x="945" y="540">Cost</text><text class="label sub" x="945" y="560">tenant budget</text>
      <rect class="store" x="40" y="515" width="150" height="62" rx="14"/><text class="label" x="115" y="540">Supabase</text><text class="label sub" x="115" y="560">Auth + RLS + DB</text>
      <rect class="external" x="970" y="70" width="150" height="60" rx="14"/><text class="label" x="1045" y="92">Secret Store</text><text class="label sub" x="1045" y="114">server-only</text>
      <text x="40" y="625" fill="#52606d" font-size="12">Kesikli çizgi: güvenlik sınırı / server-only erişim</text>
    </svg>
    <div class="legend"><span><i class="dot" style="background:#eef7ff;border-color:#1677ff"></i>Uygulama çekirdeği</span><span><i class="dot" style="background:#ecfdf3;border-color:#159570"></i>Kalıcı kayıt</span><span><i class="dot" style="background:#fff8eb;border-color:#d97706"></i>Dış servis / insan kapısı</span></div>
  </main>
</body>
</html>
